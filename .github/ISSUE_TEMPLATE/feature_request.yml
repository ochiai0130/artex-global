name: 💡 機能提案
description: 新しい機能や改善のアイデアを提案します。
title: "[提案] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        アイデアの提案ありがとうございます。下の項目を埋めていただけると、方向を合わせやすくなります。
  - type: checkboxes
    id: preflight
    attributes:
      label: 確認
      options:
        - label: 似た提案がすでに開いていないか検索しました。
          required: true
        - label: この提案は、許可された利用範囲と適用される法令を超えた利用を助長しません。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: どの問題・必要から出発しましたか
      description: 解決したい状況を先に書いてください。解決策より、問題を知ることの方が重要です。
      placeholder: "例: 検出結果をチームで共有するとき、レポートを PDF で書き出したいです。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する方法
      description: どのように解決するとよいかを書いてください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: ほかの方法を考えた場合は書いてください。
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 関連する領域
      options:
        - エージェント (agent)
        - Web UI / サーバー (web / server)
        - LLM プロバイダ連携
        - 文書・翻訳
        - その他
    validations:
      required: false

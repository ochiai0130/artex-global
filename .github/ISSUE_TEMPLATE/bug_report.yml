name: 🐛 バグ報告
description: 期待と違う動作や、エラーが起きる問題を報告します。
title: "[バグ] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        報告ありがとうございます。下の項目を埋めていただけると、再現と修正が速くなります。
        **セキュリティ上の脆弱性は、このテンプレートではなく [SECURITY.md](https://github.com/jiwoochris/artex-global/security/policy) の非公開手順で報告してください。**
  - type: checkboxes
    id: preflight
    attributes:
      label: 確認
      options:
        - label: 似た Issue がすでに開いていないか検索しました。
          required: true
        - label: この問題は、所有または許可を得た対象、あるいはローカルに隔離した環境で再現したものです。
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 何が起きましたか
      description: 期待した動作と、実際の動作を一緒に書いてください。
      placeholder: "例: 検出結果が日本語になるべきところ、中国語で出力されます。"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: 問題を再び作り出せる手順を、順番に書いてください。
      placeholder: |
        1. 「...」画面へ移動
        2. 「...」を実行
        3. 「...」でエラー
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: ログ・スクリーンショット
      description: 関連するログや画面を貼ってください。機微な値（API キー、トークン、対象のアドレス）は隠してください。
      render: shell
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: 領域
      description: 問題が起きた構成要素を選んでください。
      options:
        - エージェント (agent)
        - Web UI / サーバー (web / server)
        - インストール・配布 (Docker・スクリプト)
        - LLM プロバイダ連携
        - 文書・翻訳
        - わからない
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: バージョン
      description: リリースタグまたはコミットハッシュを書いてください。
      placeholder: "例: v2.2.0 または b45ba04"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 実行環境
      description: OS、Docker の使用有無、LLM モデルなどを書いてください。
      placeholder: "例: macOS 15 / Docker Compose / claude-opus-4-8"
    validations:
      required: false

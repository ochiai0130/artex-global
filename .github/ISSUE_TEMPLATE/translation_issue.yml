name: 🌐 翻訳・ローカライズの誤り
description: 翻訳（日本語・英語・韓国語・中国語・スペイン語）が不自然、誤り、または欠落している箇所を報告します。
title: "[翻訳] "
labels: ["i18n"]
body:
  - type: markdown
    attributes:
      value: |
        グローバル版の翻訳品質を高める手助けをありがとうございます。
        このリポジトリのローカライズ方針は、**ユーザーに見える成果物だけを設定した言語に変え、エージェントの内部推論プロンプトと、コマンド・ペイロード・コード・ログの原文はそのまま残す**ことです。
        詳しい原則は [CONTRIBUTING.md](https://github.com/jiwoochris/artex-global/blob/main/CONTRIBUTING.md#ローカライズ方針) にあります。
  - type: dropdown
    id: kind
    attributes:
      label: どの種類の問題ですか
      options:
        - 翻訳が不自然
        - 翻訳が誤っている（意味が違う）
        - 翻訳が欠けている（まだ中国語や英語のまま見える）
        - 翻訳してはいけないものが翻訳されている（コマンド、コード、ログなど）
        - 用語の統一が必要
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: どこで見えますか
      options:
        - Web UI
        - エージェントの成果物（検出結果・要約・レポート・会話の応答）
        - 文書（README など）
        - その他
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 現在の文言
      description: いま見えている文言を、そのまま貼ってください。どの画面の、どの状況かも書いていただけると助かります。
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: 提案する文言
      description: どのように変えるとよいかを提案してください。（任意）
    validations:
      required: false
  - type: input
    id: key
    attributes:
      label: メッセージキー / ファイルの位置
      description: 分かる場合だけ。たとえば web/messages/ja.json のキーやファイルパスを書いてください。
      placeholder: "例: web/messages/ja.json → dashboard.title"
    validations:
      required: false
